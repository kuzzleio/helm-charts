{{- $mtls := .Values.mtls | default dict -}}
{{- $networkPolicy := $mtls.networkPolicy | default dict -}}
{{- if and $mtls.enabled (ne (toString (dig "enabled" true $networkPolicy)) "false") -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuzzle.fullname" . | trunc 63 | trimSuffix "-" }}
  labels:
    {{- mergeOverwrite (fromYaml (include "kuzzle.labels" .)) (deepCopy (.Values.labels | default dict)) | toYaml | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuzzle.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range $networkPolicy.allowedNamespaces | default list }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
{{- end }}
