{{- /*
  `helm upgrade --reuse-values` replaces the new chart's defaults with the old
  release's values: a release installed before 1.13.0 has no `podMonitor` at
  all. Read it through a dict so that case renders nothing instead of failing.
*/ -}}
{{- $podMonitor := .Values.podMonitor | default dict }}
{{- if $podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "kuzzle.fullname" . }}
  labels:
    {{- include "kuzzle.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- range $key, $value := $podMonitor.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kuzzle.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: kuzzle-api
      path: {{ .Values.metrics.path | quote }}
      interval: {{ $podMonitor.interval | default "60s" | quote }}
      honorLabels: true
      {{- with (.Values.podMonitor.targetLabels | default dict) }}
      # Target labels: `up` and `scrape_*` only carry these, never the
      # labels the exporter puts on its own series.
      relabelings:
        {{- range $key, $value := . }}
        - targetLabel: {{ $key | quote }}
          replacement: {{ $value | quote }}
        {{- end }}
      {{- end }}
      authorization:
        type: Bearer
        credentials:
          name: {{ required "podMonitor.secretName is required when podMonitor.enabled" $podMonitor.secretName | quote }}
          key: {{ required "podMonitor.secretKey is required when podMonitor.enabled" $podMonitor.secretKey | quote }}
{{- end }}
